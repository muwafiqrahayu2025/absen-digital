<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="/logo.png" sizes="512x512">
    <title>ABDI Absen Digital</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;right:0;background:red;color:white;padding:20px;z-index:999999;font-family:monospace;white-space:pre-wrap;">FATAL ERROR:<br/>' + e.message + '<br/><br/>' + e.filename + ':' + e.lineno + '<br/><br/>' + (e.error && e.error.stack ? e.error.stack : '') + '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;right:0;background:red;color:white;padding:20px;z-index:999999;font-family:monospace;white-space:pre-wrap;">UNHANDLED PROMISE REJECTION:<br/>' + e.reason + '</div>';
      });
    </script>
  </body>
</html>
